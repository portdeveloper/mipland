name: MIP upstream review

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check upstream specifications
        run: node scripts/check-mip-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
