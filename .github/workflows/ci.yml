# Build every PR and every push to master, so pool contributions get checked
# automatically instead of a maintainer running the build by hand.
# No lint gate yet: the tree has ~20 pre-existing eslint errors, and a gate
# that fails on day one teaches everyone to ignore it. Add `pnpm lint` here
# once those are fixed (tracked in the issues).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
